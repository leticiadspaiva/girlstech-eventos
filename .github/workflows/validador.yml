name: Validar Eventos Girls Tech

# Roda toda vez que alguém alterar o eventos.json (direto na main ou via Pull Request)
on:
  push:
    paths:
      - 'eventos.json'
      - 'scripts/**'
  pull_request:
    paths:
      - 'eventos.json'
      - 'scripts/**'

jobs:
  verificacao-de-dados:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Fiscalizar eventos.json (formato, campos, datas, custo e links)
        run: python3 scripts/validar.py
